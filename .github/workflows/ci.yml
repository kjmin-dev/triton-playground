name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint + format + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        run: pip install uv

      - name: Create venv and install deps
        run: |
          uv venv .venv
          uv sync

      - name: Lint
        run: .venv/bin/ruff check .

      - name: Format check
        run: .venv/bin/ruff format --check .

      - name: Test
        run: PYTHONPATH=. .venv/bin/python -m pytest tests/ -q

  web:
    name: Web (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/web
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install
        working-directory: .

      - name: Lint
        run: bunx biome check src/

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Build
        run: bun --bun vite build
