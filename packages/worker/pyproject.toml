[project]
name = "triton-playground-worker"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "tritonclient[grpc]>=2.49",
    "numpy>=1.24",
    "python-multipart>=0.0.18",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[tool.ruff]
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
