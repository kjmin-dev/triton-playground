[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triton-playground-worker"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "tritonclient[grpc]>=2.49",
    "huggingface_hub>=0.34",
    "numpy>=1.24",
    "python-multipart>=0.0.18",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0",
    "pyright>=1.1",
    "ruff>=0.4",
]

[tool.pyright]
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
typeCheckingMode = "off"
reportMissingImports = true
reportUndefinedVariable = true
exclude = ["pipeline/backend_templates/"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "TC004"]
ignore = ["E501", "B008", "SIM108", "SIM117", "RUF001", "RUF012", "RUF046"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "pipeline*"]
