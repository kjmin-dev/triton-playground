language: python
toolchains:
  unstable_python: false
  unstable_uv: false

tasks:
  compile:
    command: .venv/bin/python -m compileall .
  dev:
    command: bash ../../scripts/dev-worker.sh
    options:
      cache: false
      persistent: true
  prepare-models:
    command: PYTHONPATH=. .venv/bin/python -m pipeline.prepare_models --output-root ../../model_repository
  prepare-localize:
    command: PYTHONPATH=. .venv/bin/python -m pipeline.prepare_models --profile localize --materialize-manual-models --output-root ../../model_repository
  download-weights:
    command: PYTHONPATH=. .venv/bin/python -m pipeline.download_weights
  prepare-manual-stubs:
    command: PYTHONPATH=. .venv/bin/python -m pipeline.prepare_models --profile localize --output-root ../../model_repository --manual-stub-root ../../manual_model_stubs
  lint:
    command: .venv/bin/ruff check .
    options:
      cache: false
  format:
    command: .venv/bin/ruff format .
  format-check:
    command: .venv/bin/ruff format --check .
    options:
      cache: false
  typecheck:
    command: PYTHONPATH=. .venv/bin/pyright .
    options:
      cache: false
  test:
    command: PYTHONPATH=. .venv/bin/python -m pytest tests/ -q
