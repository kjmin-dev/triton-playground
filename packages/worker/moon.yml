language: python
toolchains:
  unstable_python: false
  unstable_uv: false

tasks:
  compile:
    command: .venv/bin/python -m compileall .
  dev:
    command: .venv/bin/uvicorn api.main:app --reload --host 0.0.0.0 --port 8080
    options:
      persistent: true
  prepare-models:
    command: PYTHONPATH=. .venv/bin/python -m pipeline.prepare_models --profile baseline --output-root ../../model_repository
  lint:
    command: .venv/bin/ruff check .
  format:
    command: .venv/bin/ruff format .
  test:
    command: .venv/bin/python -m unittest discover -s tests
