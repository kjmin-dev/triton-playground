language: python

tasks:
  dev:
    command: uvicorn api.main:app --reload --host 0.0.0.0 --port 8080
    options:
      persistent: true
  prepare-models:
    command: PYTHONPATH=. python -m pipeline.prepare_models --profile baseline --output-root ../../model_repository
  lint:
    command: ruff check .
  format:
    command: ruff format .
  test:
    command: python -m unittest discover -s tests
