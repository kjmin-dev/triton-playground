services:
  triton:
    image: nvcr.io/nvidia/tritonserver:24.05-py3
    command: tritonserver --model-repository=/models
    volumes:
      - ./model_repository:/models
    ports:
      - "8000:8000" # HTTP
      - "8001:8001" # gRPC
      - "8002:8002" # Metrics
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    shm_size: "2g"

  worker:
    build:
      context: .
      dockerfile: packages/worker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - TRITON_GRPC_URL=triton:8001
    depends_on:
      - triton

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - WORKER_API_URL=http://worker:8080
    depends_on:
      - worker
